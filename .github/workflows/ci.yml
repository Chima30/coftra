name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No env files or keys committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|keystore/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Sensitive files tracked:"; echo "$bad"; exit 1; fi
          if git grep -nE '(PRIVATE_KEY|private_key)\s*=\s*(0x)?[0-9a-fA-F]{64}' -- ':!*.md'; then
            echo "Possible private key in source"; exit 1; fi

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge build --sizes
      - run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci

  slither:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.1
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
